function render(){lock=false;orderPicked=[];helpShown=false;if(i>=cur.qs.length){finish();return}let q=cur.qs[i];if(q[0]==="order"){let shuffled=q[2].map((_,n)=>n);for(let j=shuffled.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[shuffled[j],shuffled[k]]=[shuffled[k],shuffled[j]];}if(shuffled.every((v,n)=>v===n)&&shuffled.length>1){[shuffled[0],shuffled[1]]=[shuffled[1],shuffled[0]];}q._shuffled=shuffled;}document.getElementById("count").textContent=`${cur.id} · ${i+1}/${cur.qs.length}`;document.getElementById("prog").style.width=(i/cur.qs.length*100)+"%";let path=cur.path||["Wiederholen","Test"];let phase=Math.min(path.length-1,Math.floor(i/(cur.qs.length/path.length)));let nav=`<div class="path">${path.map((x,n)=>`<span class="node ${n==phase?"active":""}">${x}</span>`).join("")}</div>`;let s=`<div class="tag">${cur.id}</div>${nav}<h2 class="q">${q[1]}</h2>${supportBar()}`;

else if(q[0]=="listen")s+=`<div class="listen"><button class="audioBtn" onclick="speakCurrent()">🔊 Anhören</button><div class="smallnote">Du kannst den Satz mehrmals anhören.</div></div><div class="choices">${q[3].map((x,n)=>`<button class="choice" onclick="ansC(${n},this)">${x}</button>`).join("")}</div>`;
else if(q[0]=="listenfill")s+=`<div class="listen"><button class="audioBtn" onclick="speakCurrent()">🔊 Anhören</button><div class="smallnote">Höre genau zu und ergänze das fehlende Wort.</div></div><p style="font-size:20px">${q[3]}</p><input id="inp" autocomplete="off" autocapitalize="none" placeholder="Wort eingeben" onkeydown="if(event.key==='Enter')ansF()"><br><button class="primary" onclick="ansF()">Prüfen</button>`;

function taskHint(q){
let t=q.slice(1).join(" ").toLowerCase();
let verb=t.includes("sein")?"sein":t.includes("brauch")?"brauchen":t.includes("haben")?"haben":t.includes("liegen")?"liegen":t.includes("beginnen")?"beginnen":t.includes("enden")?"enden":null;
let forms={sein:["bin","bist","ist","sind","seid","sind"],brauchen:["brauche","brauchst","braucht","brauchen","braucht","brauchen"],haben:["habe","hast","hat","haben","habt","haben"],liegen:["liege","liegst","liegt","liegen","liegt","liegen"],beginnen:["beginne","beginnst","beginnt","beginnen","beginnt","beginnen"],enden:["ende","endest","endet","enden","endet","enden"]};
if(verb)return "<b>So geht es:</b> Schau auf die Person vor der Lücke. Wähle die richtige Form von <b>"+verb+"</b>.<table>"+["ich","du","er/sie/es","wir","ihr","sie/Sie"].map((p,i)=>"<tr><td>"+p+"</td><td><b>"+forms[verb][i]+"</b></td></tr>").join("")+"</table>";
if(q[0]==="listen"||q[0]==="listenfill")return "Tippe auf 🔊 Anhören. Höre den Satz mehrmals. Wähle die passende Antwort oder schreibe das fehlende Wort.";
if(q[0]==="pic")return "Schau das Bild an und wähle das passende Wort. Lerne Nomen immer mit ihrem Artikel.";
if(q[0]==="order")return "Tippe die Wörter in der richtigen Reihenfolge an. Im Aussagesatz steht das Verb normalerweise an zweiter Stelle.";
if(q[0]==="a")return "Welcher Artikel passt? <b>der</b> Bleistift, <b>die</b> Schere, <b>das</b> Heft.";
if(t.includes("einen")||t.includes("keinen")||t.includes("akkusativ"))return "Nach brauchen und haben steht der Akkusativ: <b>der → einen</b>, <b>die → eine</b>, <b>das → ein</b>. Bei Verneinung: keinen / keine / kein.";
if(t.includes("montag")||t.includes("dezember")||t.includes("august")||t.includes("uhr")||t.includes("monat")||t.includes("wann"))return "Zeitangaben: <b>am</b> Montag, <b>im</b> Mai, <b>um</b> 8 Uhr. <b>Wann?</b> fragt nach dem Zeitpunkt.";
if(q[0]==="input"||q[0]==="fill")return "Lies den Satz. Die Striche ___ zeigen die Lücke. Schreibe nur das fehlende Wort hinein.";
return "Lies die Frage und alle Antworten. Achte darauf, ob nach wer, was, wo oder wann gefragt wird.";
}
function toggleHelp(){helpShown=!helpShown;let el=document.getElementById("helpcontent");el.hidden=!helpShown;el.innerHTML=taskHint(cur.qs[i]);document.getElementById("helpbtn").textContent=helpShown?"✕ Schließen":"💡 Hilfe";}
function translateNow(){let lang=document.getElementById("lang").value;if(!lang){alert("Bitte zuerst eine Sprache wählen.");return;}localStorage.setItem("dazlang",lang);let q=cur.qs[i],p=[q[1]];if(q[0]==="pic"||q[0]==="listen")p.push(q[3].join("; "));else if(q[0]==="c"||q[0]==="order")p.push(q[2].join("; "));else if(q[0]==="listenfill")p.push(q[3]);if(helpShown)p.push(document.getElementById("helpcontent").innerText);let url="https://translate.google.com/?sl=de&tl="+encodeURIComponent(lang)+"&text="+encodeURIComponent(p.join("\n"))+"&op=translate";window.open(url,"_blank","noopener,noreferrer");}
function supportBar(){let saved=localStorage.getItem("dazlang")||"";return '<div class="assist"><button id="helpbtn" onclick="toggleHelp()">💡 Hilfe</button><select id="lang" aria-label="Sprache" onchange="localStorage.setItem(\'dazlang\',this.value)">'+langs.map(([v,n])=>'<option value="'+v+'" '+(v===saved?"selected":"")+'>'+n+'</option>').join("")+'</select><button onclick="translateNow()">🌍 Übersetzen ↗</button></div><div id="helpcontent" class="helpbox" hidden></div>';}

let orderPicked=[];
function pickWord(n,e){if(lock||e.classList.contains("used"))return;orderPicked.push(n);e.classList.add("used");let q=cur.qs[i],box=document.getElementById("sentence");box.innerHTML=orderPicked.map(k=>`<span class="chip">${q[2][k]}</span>`).join("")}
function resetOrder(){orderPicked=[];document.querySelectorAll(".chip.used").forEach(x=>x.classList.remove("used"));let b=document.getElementById("sentence");if(b)b.innerHTML='<span class="hint">Tippe die Wörter in der richtigen Reihenfolge an.</span>'}
function checkOrder(){if(lock)return;let q=cur.qs[i],v=orderPicked.map(k=>q[2][k]).join(" "),ok=v===q[3],f=document.getElementById("fb");lock=true;if(ok){right++;xp+=10;save();f.style.color="#16a34a";f.textContent="✓ Richtig! +10 ⭐"}else{f.style.color="#dc2626";f.textContent="Fast! Richtig ist: "+q[3]}registerResult(ok,q);document.getElementById("next").style.display="inline-block";orderPicked=[]}
function normFill(x){return String(x||"").trim().toLocaleLowerCase("de-DE").replace(/[.!?,;:]+$/,"")}
function ansF(){
 if(lock)return;
 let q=cur.qs[i],el=document.getElementById("inp");
 if(!el)return;
 let value=normFill(el.value),target=q[4];
 if(!value)return;
 lock=true;
 let ok=value===normFill(target),f=document.getElementById("fb");
 if(ok){right++;xp+=10;save();el.style.borderColor="#22c55e";f.style.color="#16a34a";f.textContent="✓ Richtig! +10 ⭐"}
 else{el.style.borderColor="#ef4444";f.style.color="#dc2626";f.textContent="Fast! Richtig ist: "+target}
 registerResult(ok,q);document.getElementById("next").style.display="inline-block";
}
function speakText(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.82;u.pitch=1;speechSynthesis.speak(u)}catch(e){alert("Audio ist in diesem Browser leider nicht verfügbar.")}}
function speakCurrent(){let q=cur.qs[i];speakText(q[2])}
function ansC(n,e){
 if(lock)return;
 let q=cur.qs[i];
 let answerIndex=(q[0]=="pic"||q[0]=="listen")?q[4]:q[3];
 let ok=n===answerIndex;
 lock=true;
 mark(ok,e);
 if(!ok){
   let buttons=document.querySelectorAll(".choice");
   if(buttons[answerIndex])buttons[answerIndex].classList.add("ok");
 }
}
function ansA(v,e){if(lock)return;lock=true;let q=cur.qs[i],ok=v===q[2];mark(ok,e);if(!ok)document.querySelector("."+q[2]).style.outline="4px solid #86efac"}

function skillOf(q){
 let txt=(q.slice(1).join(" ")+"").toLowerCase();
 if(txt.includes("brauch"))return "brauchen";
 if(txt.includes("sein")||txt.includes(" bin")||txt.includes(" bist")||txt.includes(" sind"))return "sein";
 if(txt.includes("haben")||txt.includes(" habe")||txt.includes(" habt"))return "haben";
 if(txt.includes("___")&&(txt.includes("bleistift")||txt.includes("schere")||txt.includes("heft")))return "artikel";
 if(txt.includes("montag")||txt.includes("dezember")||txt.includes("august")||txt.includes("wann"))return "zeit";
 return "wortschatz";
}
function extraFor(skill){
 const bank={
  brauchen:[
   ["c","Ergänze: Er ___ ein Lineal.",["brauche","brauchst","braucht"],2],
   ["c","Ergänze: Wir ___ zwei Hefte.",["brauchen","braucht","brauchst"],0],
   ["c","Ich brauche ___ Bleistift.",["ein","eine","einen"],2]
  ],
  sein:[
   ["c","Ergänze: Ihr ___ im Klassenzimmer.",["seid","sind","ist"],0],
   ["c","Ergänze: Du ___ in der Schule.",["bin","bist","seid"],1]
  ],
  haben:[
   ["c","Ergänze: Du ___ heute Mathe.",["habe","hast","hat"],1],
   ["c","Ergänze: Wir ___ zwei Bücher.",["haben","habt","hat"],0]
  ],
  artikel:[
   ["c","Ich brauche ___ Schere.",["einen","eine","ein"],1],
   ["c","Ich brauche ___ Heft.",["einen","eine","ein"],2],
   ["c","Ich brauche ___ Radiergummi.",["einen","eine","ein"],0]
  ],
  zeit:[
   ["c","Der Termin ist ___ Dienstag.",["am","im","um"],0],
   ["c","Die Ferien sind ___ August.",["am","im","um"],1],
   ["c","Die Schule beginnt ___ 8 Uhr.",["am","im","um"],2]
  ],
  wortschatz:[
   ["pic","Was ist das?","✏️",["der Bleistift","die Schere","das Heft"],0],
   ["pic","Was ist das?","📏",["das Lineal","das Buch","der Füller"],0]
  ]
 };
 let arr=bank[skill]||bank.wortschatz;
 return [...arr[Math.floor(Math.random()*arr.length)]];
}
function registerResult(ok,q){
 if(ok){streak++; if(streak>0 && streak%3===0){xp+=5}}
 else{
   streak=0;
   let skill=skillOf(q);
   mistakes.push({q:[...q],skill});
 }
 updateGame();
}
function mark(ok,e){let f=document.getElementById("fb");if(ok){right++;xp+=10;save();e.classList.add("ok");f.style.color="#16a34a";f.textContent="✓ Richtig! +10 ⭐"}else{e.classList.add("bad");f.style.color="#dc2626";f.textContent="Noch nicht ganz – die richtige Lösung ist markiert."}document.getElementById("next").style.display="inline-block"}
function ansInput(){if(lock)return;let q=cur.qs[i],el=document.getElementById("wordinput"),v=el.value.trim().toLocaleLowerCase("de-DE"),answers=(Array.isArray(q[2])?q[2]:[q[2]]).map(x=>x.toLocaleLowerCase("de-DE"));if(!v)return;lock=true;let ok=answers.includes(v),f=document.getElementById("fb");if(ok){right++;xp+=10;save();el.style.borderColor="#22c55e";f.style.color="#16a34a";f.textContent="✓ Richtig! +10 ⭐"}else{el.style.borderColor="#ef4444";f.style.color="#dc2626";f.textContent="Richtig wäre: "+q[2][0]}document.getElementById("next").style.display="inline-block";registerResult(ok,cur.qs[i]);}
function next(){if(!lock&&cur.qs[i][0]!=="info"){registerResult(false,cur.qs[i]);}i++;render()}function finish(){document.getElementById("prog").style.width="100%";let count=mistakes.length;let bonus=Math.max(10,right*2);xp+=bonus;save();document.getElementById("qcard").innerHTML='<div class="done"><div class="stars">🏁</div><h2>Kapitel abgeschlossen!</h2><p>Du hast '+right+' Aufgaben richtig gelöst. '+(count?'Einige Antworten waren noch nicht richtig. Du kannst das Kapitel jederzeit wiederholen.':'Super, alle Aufgaben geschafft!')+'</p><p><b>Bonus: +'+bonus+' ⭐</b></p><button class="primary" onclick="restartCurrent()">Noch einmal üben</button> <button class="ghost" onclick="home()">Zur Übersicht</button></div>';}
function restartCurrent(){let id=cur.id;if(id==="TEST"){test()}else{start(id)}}
drawHome();save();
</script></body></html>
